[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conjurer"
version = "1.0.0"
description = "A chat assistant that lives inside ComfyUI's web UI — picks workflows, generates new ones from scratch, debugs broken graphs, all from natural language."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Sewa Singh Bajwa" },
]
keywords = [
    "comfyui",
    "ai",
    "llm",
    "stable-diffusion",
    "video-generation",
    "workflow",
    "assistant",
    "copilot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/ai-xcode/conjurer"
Repository = "https://github.com/ai-xcode/conjurer"
Issues = "https://github.com/ai-xcode/conjurer/issues"

# ─────── ComfyUI Registry metadata (https://registry.comfy.org/) ───────
[tool.comfy]
# Publisher slug from https://registry.comfy.org — same as the GitHub handle.
PublisherId = "ai-xcode"
DisplayName = "Conjurer"
Icon = ""
